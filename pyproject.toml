[project]
name = "distil"
version = "0.1.0"
description = "Knowledge distillation: LLM -> structured data models on transaction datasets"
requires-python = ">=3.10"
dependencies = [
    "xgboost>=2.0",
    "catboost>=1.2",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "numpy>=1.24",
    "litellm>=1.0",
    "requests>=2.31",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest", "ipython"]
colab = ["pytorch-lifestream>=0.7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/distil"]
