[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "distil"
version = "0.1.0"
description = "Bidirectional knowledge distillation between LLMs and structured event-sequence models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Victoria Shchur" }]
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "torch>=2.1",
    "pytorch-lightning>=2.1",
    "pytorch-lifestream>=0.7",
    "transformers",
    "peft",
    "datasets",
    "lightgbm",
    "xgboost",
    "shap",
    "requests",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
