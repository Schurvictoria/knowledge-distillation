[project]
name = "distil"
version = "0.1.0"
description = "Bidirectional knowledge distillation between LLMs and event-sequence models on transaction datasets"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "pytorch-lightning>=2.0",
    "pytorch-lifestream>=0.7.0",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "catboost>=1.2",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "numpy>=1.24",
    "shap>=0.42",
    "transformers>=4.40",
    "peft>=0.10",
    "datasets>=2.16",
    "bitsandbytes>=0.42",
    "litellm>=1.0",
    "requests>=2.31",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest", "ipython", "ruff"]
api = ["openai>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/distil"]

[tool.hatch.build.targets.wheel.sources]
"src/distil" = "distil"
